name: Garden Controller

on:
  push:
    paths:
      - "garden-controller/**"
  pull_request:
    paths:
      - "garden-controller/**"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Task
        uses: arduino/setup-task@v1
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ./garden-controller/.pio
          key: ${{ runner.os }}-pio-${{ hashFiles('garden-controller/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware
        run: task -t GithubActionTasks.yml main:pio

  release:
    name: Build and release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Task
        uses: arduino/setup-task@v1
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ./garden-controller/.pio
          key: ${{ runner.os }}-pio-${{ hashFiles('garden-controller/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware
        run: task -t GithubActionTasks.yml main:pio

      - name: Create or update rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -f controller-latest
          git push -f origin controller-latest
          if gh release view controller-latest > /dev/null 2>&1; then
            gh release edit controller-latest \
              --target ${{ github.sha }} \
              --title "Garden Controller Latest" \
              --notes "Built from commit ${{ github.sha }}" \
              --latest=false
            gh release upload controller-latest \
              garden-controller/.pio/build/esp32dev/firmware.bin \
              --clobber
          else
            gh release create controller-latest \
              garden-controller/.pio/build/esp32dev/firmware.bin \
              --target ${{ github.sha }} \
              --title "Garden Controller Latest" \
              --notes "Built from commit ${{ github.sha }}" \
              --latest=false
          fi
