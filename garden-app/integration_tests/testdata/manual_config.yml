web_server:
  port: 8080
mqtt:
  broker: "localhost"
  port: 1883
  client_id: "garden-manual"
influxdb:
  address: "http://localhost:8086"
  token: "my-secret-token"
  org: "garden"
  bucket: "garden"
storage:
  connection_string: "manual_test.db"

controller:
  topic_prefix: "test"
  num_zones: 3
  publish_water_event: true
  publish_health: true
  health_interval: 500ms
  temperature_value: 50
  humidity_value: 50
  temperature_humidity_disable_noise: true
  enable_ui: false
  sensors:
    - name: Ambient
      type: DHT22
      pin: GPIO_NUM_21
      interval: 100ms
    - name: Water
      type: DS18B20
      pin: GPIO_NUM_22
      interval: 100ms
